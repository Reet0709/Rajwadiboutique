backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"
logo_url: "https://rajwadiboutique.com/assets/logo.png"

collections:
  - name: "shop"
    label: "Shop Management"
    files:
      - label: "All Products"
        name: "suits"
        file: "data/suits.json"
        fields:
          - label: "Products Inventory"
            name: "suits"
            widget: "list"
            fields:
              - {label: "Product Name", name: "name", widget: "string"}
              - {label: "Category", name: "category", widget: "select", options: ["saree", "lehenga", "coord", "suits", "unstitched"], default: "saree"}
              - {label: "Price (INR)", name: "price", widget: "number"}
              - {label: "Fabric", name: "fabric", widget: "string", required: false}
              - {label: "Work Type", name: "work", widget: "string", required: false}
              - {label: "Color Group", name: "colorGroup", widget: "select", options: ["red", "green", "blue", "gold", "pastel", "dark"], required: false}
              - label: "Media Gallery (Images/Videos)"
                name: "media"
                widget: "list"
                field: {label: "Media File", name: "file", widget: "file"}
              
              
  - name: "atelier"
    label: "Digital Atelier (Reels)"
    files:
      - label: "Instagram Reels"
        name: "reels"
        file: "data/reels.json"
        fields:
          - label: "Reels Inventory"
            name: "reels"
            widget: "list"
            fields:
              - {label: "Instagram Reel URL", name: "url", widget: "string", required: true}
              - {label: "Title", name: "title", widget: "string", required: false}
              - {label: "Tag (e.g. #Bridal)", name: "tag", widget: "string", required: false}
              - {label: "Log Title", name: "logTitle", widget: "string", required: false}
              - {label: "Log Note", name: "logNote", widget: "text", required: false}
              - {label: "Color Theme", name: "colorGroup", widget: "string", required: false}
              - {label: "Video Cover Image", name: "image", widget: "image", required: true}

  - name: "heritage_diary"
    label: "Heritage Diary (Testimonials)"
    files:
      - label: "Client Testimonials"
        name: "testimonials"
        file: "data/testimonials.json"
        fields:
          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            fields:
              - {label: "Date", name: "date", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Review Body", name: "body", widget: "text"}
              - {label: "Signature (Name)", name: "signature", widget: "string"}
